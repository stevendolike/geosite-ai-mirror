name: rebuild

on:
  schedule:
    - cron: "23 20 * * 0"   # Sun 20:23 UTC = Mon 04:23 HKT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download community dlc.dat (latest release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          url=$(gh api repos/v2fly/domain-list-community/releases/latest \
                 --jq '.assets[] | select(.name=="dlc.dat.xz") | .browser_download_url')
          echo "asset: $url"
          curl -fsSL -o dlc.dat.xz "$url"
          xz -d dlc.dat.xz
          sha256sum dlc.dat

      - name: Build trimmed geosite-ai.dat
        run: |
          set -e
          mkdir -p docs
          python3 build_dat.py dlc.dat docs/geosite-ai.dat \
            --category "category-ai-!cn" \
            --out-category "CATEGORY-AI-!CN" \
            --exclude "xai,google-deepmind"

      - name: Sanity gate
        run: |
          set -e
          kept=$(wc -l < docs/geosite-ai.dat.list)
          removed=$(wc -l < docs/geosite-ai.dat.removed)
          size=$(wc -c < docs/geosite-ai.dat)
          echo "kept=$kept removed=$removed size=$size"
          [ "$kept" -ge 100 ] || { echo "FAIL: kept too small"; exit 1; }
          [ "$removed" -ge 50 ] || { echo "FAIL: exclusions vanished upstream?"; exit 1; }
          [ "$size" -gt 2000 ] || { echo "FAIL: dat too small"; exit 1; }
          grep -qx "chatgpt.com" docs/geosite-ai.dat.list || { echo "FAIL: chatgpt.com missing"; exit 1; }
          ! grep -qxE "grok\\.com|x\\.ai|gemini\\.google\\.com" docs/geosite-ai.dat.list || { echo "FAIL: excluded domain leaked"; exit 1; }

      - name: Commit docs if changed
        run: |
          set -e
          git config user.name "geosite-ai-bot"
          git config user.email "geosite-ai-bot@users.noreply.github.com"
          git add -f docs
          if git diff --cached --quiet; then
            echo "no change — nothing to commit"
          else
            git commit -m "dlc refresh $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push
          fi
